[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_port = COM6
upload_speed = 115200
monitor_port = COM6
monitor_speed = 9600
monitor_dtr = 0
monitor_rts = 0
board_build.filesystem = littlefs
lib_deps =
  adafruit/Adafruit SHT31 Library@2.2.2
  adafruit/Adafruit BusIO@1.17.4
  claws/BH1750@1.3.0
  bblanchon/ArduinoJson@7.4.3
